		<script type="text/javascript">
			((l) => {
				if (l.search && l.search.slice(1)[0] === "/") {
					var decoded = l.search
						.slice(1)
						.split("&")
						.map(function (s) {
							return s.replace(/~and~/g, "&");
						})
						.join("?");

					var base =
						l.pathname.slice(-1) === "/"
							? l.pathname.slice(0, -1)
							: l.pathname;

					window.history.replaceState(null, null, base + decoded + l.hash);
				}
			})(window.location);
		</script>
